[package]
name = "ttk"
version = "1.1.0"
edition = "2024"

[dependencies]
cod = { version = "9.0.5", features = ["crossterm"] }
dirs = "7.0.0"
linoleum = "3.0.1"
rand = "0.10.3"
mlua = { version = "0.12", features = ["module"], optional = true }

[features]
default = []

lua = ["dep:mlua"]
lua55 = ["lua", "mlua/lua55"]
lua54 = ["lua", "mlua/lua54"]
lua53 = ["lua", "mlua/lua53"]
lua52 = ["lua", "mlua/lua52"]
lua51 = ["lua", "mlua/lua51"]
luajit = ["lua", "mlua/luajit"]
luajit52 = ["lua", "mlua/luajit52"]
luau = ["lua", "mlua/luau"]
luau-jit = ["lua", "mlua/luau-jit"]

[lib]
name = "ttk"
crate-type = ["lib", "cdylib"]
